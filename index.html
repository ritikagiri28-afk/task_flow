<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Todo List</title>
    <style>
      :root {
        color-scheme: light;
        font-family: system-ui, sans-serif;
        color: #1f2937;
        background: #f3f4f6;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: start center;
        padding: 4rem 1rem;
      }

      main {
        width: min(100%, 32rem);
        padding: 2rem;
        border-radius: 1rem;
        background: #fff;
        box-shadow: 0 10px 30px rgb(31 41 55 / 8%);
      }

      h1 {
        margin: 0 0 1.5rem;
      }

      form {
        display: flex;
        gap: 0.75rem;
      }

      input {
        min-width: 0;
        flex: 1;
        padding: 0.75rem;
        border: 1px solid #d1d5db;
        border-radius: 0.5rem;
        font: inherit;
      }

      button {
        padding: 0.75rem 1rem;
        border: 0;
        border-radius: 0.5rem;
        color: #fff;
        background: #2563eb;
        font: inherit;
        cursor: pointer;
      }

      ul {
        display: grid;
        gap: 0.75rem;
        margin: 1.5rem 0 0;
        padding: 0;
        list-style: none;
      }

      .empty-state {
        margin: 1.5rem 0 0;
        color: #6b7280;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Todo List</h1>

      <form>
        <label for="todo-input" hidden>New todo</label>
        <input id="todo-input" name="todo" type="text" placeholder="What needs to be done?" />
        <button type="submit">Add</button>
      </form>

      <ul id="todo-list" aria-label="Todo items"></ul>
      <p class="empty-state">Your todos will appear here.</p>
    </main>
  </body>
</html>
